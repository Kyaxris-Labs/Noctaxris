AWSTemplateFormatVersion: "2010-09-09"
Description: "Noctaxris CFN lab: Lambda ZipFile java21 + IAM role (YAML)"
Resources:
  LabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: REPLACE_ROLE_NAME
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
  LabFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: REPLACE_FUNCTION_NAME
      Role: !GetAtt LabRole.Arn
      Runtime: java21
      Handler: example.Handler::handleRequest
      Code:
        ZipFile: |
          package example;
          public class Handler {
            public static String handleRequest(String in) {
              return "{\"ok\":true}";
            }
          }
