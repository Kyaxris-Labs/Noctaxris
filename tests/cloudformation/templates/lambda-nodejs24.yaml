AWSTemplateFormatVersion: "2010-09-09"
Description: "Noctaxris CFN lab: Lambda ZipFile Node.js 24.x + IAM role (YAML)"
Resources:
  LabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: REPLACE_ROLE_NAME
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
  LabFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: REPLACE_FUNCTION_NAME
      Role: !GetAtt LabRole.Arn
      Runtime: nodejs24.x
      Handler: index.handler
      Code:
        ZipFile: |
          exports.handler = async () => ({ ok: true });
