# Experimental restricted nested engine (no privileged: true).
# Classic DinD usually still needs privileged on Docker Desktop / WSL2.
# Use only after nested smoke passes with this overlay; default compose.yaml
# keeps privileged DinD for reliable Lambda Invoke / ECS RunTask.
#
# Usage (from docker/):
#   docker compose -f compose.yaml -f compose.engine-restricted.yaml --env-file .env up --build
#
# Nested smoke against this overlay:
#   COMPOSE_FILES="-f compose.yaml -f compose.engine-restricted.yaml" bash smoke-nested.sh
#
# Keep host publish on 127.0.0.1:4566. Never add host docker.sock on the API.
services:
  noctaxris-engine:
    privileged: false
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    devices:
      - /dev/fuse
