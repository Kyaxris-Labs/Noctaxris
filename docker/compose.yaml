services:
  noctaxris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      NOCTAXRIS_LISTEN: "0.0.0.0:4566"
      NOCTAXRIS_DATA_ROOT: "/var/lib/noctaxris"
      NOCTAXRIS_ROOT_ACCESS_KEY_ID: "${NOCTAXRIS_ROOT_ACCESS_KEY_ID}"
      NOCTAXRIS_ROOT_SECRET_ACCESS_KEY: "${NOCTAXRIS_ROOT_SECRET_ACCESS_KEY}"
      NOCTAXRIS_ACCOUNT_ID: "000000000001"
      # Nested DinD API on the Compose network only (never host docker.sock).
      NOCTAXRIS_DOCKER_HOST: "tcp://noctaxris-engine:2375"
      # Function containers run inside DinD and reach the published API via
      # host.docker.internal (Docker Desktop). Override for Linux or custom wiring.
      NOCTAXRIS_LAMBDA_ENDPOINT_URL: "${NOCTAXRIS_LAMBDA_ENDPOINT_URL:-http://host.docker.internal:4566}"
    volumes:
      - noctaxris-data:/var/lib/noctaxris
    # DO NOT add docker.sock
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      noctaxris-engine:
        condition: service_started
  noctaxris-engine:
    image: docker:27-dind
    privileged: true
    environment:
      # Lab: plain TCP on the Compose network. Do not publish 2375 to the host.
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - noctaxris-data:/var/lib/noctaxris
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Engine API stays on the Compose network only; do not add a host mapping for 2375.
volumes:
  noctaxris-data:
