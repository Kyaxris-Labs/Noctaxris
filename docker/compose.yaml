services:
  noctaxris-compute-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - noctaxris-compute:/lambda
    # Named volumes are root-owned on first create; API runs as UID 65532 (distroless nonroot).
    command: ["sh", "-c", "chown -R 65532:65532 /lambda && chmod 775 /lambda"]
  noctaxris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      NOCTAXRIS_LISTEN: "0.0.0.0:4566"
      # Required for the container bind above. Host publish must stay 127.0.0.1:4566.
      # Do not remap ports to 0.0.0.0 without TLS. Prefer NOCTAXRIS_TLS_CERT/KEY.
      NOCTAXRIS_ALLOW_NONLOOPBACK_LISTEN: "1"
      # Intentionally unset: Function URL / HTTP API AuthType NONE stay off on this
      # non-loopback bind. Opt in for CTF labs only:
      # NOCTAXRIS_ALLOW_OPEN_DATA_PLANE: "1"
      NOCTAXRIS_DATA_ROOT: "/var/lib/noctaxris"
      NOCTAXRIS_ROOT_ACCESS_KEY_ID: "${NOCTAXRIS_ROOT_ACCESS_KEY_ID}"
      NOCTAXRIS_ROOT_SECRET_ACCESS_KEY: "${NOCTAXRIS_ROOT_SECRET_ACCESS_KEY}"
      NOCTAXRIS_ACCOUNT_ID: "000000000001"
      # Nested DinD API on the Compose network only (TLS on 2376, never host docker.sock).
      NOCTAXRIS_DOCKER_HOST: "tcp://noctaxris-engine:2376"
      NOCTAXRIS_DOCKER_CERT_PATH: "/certs/client"
      # Function containers run inside DinD and reach the published API via
      # host.docker.internal (Docker Desktop). Override for Linux or custom wiring.
      NOCTAXRIS_LAMBDA_ENDPOINT_URL: "${NOCTAXRIS_LAMBDA_ENDPOINT_URL:-http://host.docker.internal:4566}"
      # Lambda ExtraHosts host.docker.internal (default on). Set to 0 to omit.
      # NOCTAXRIS_INJECT_HOST_GATEWAY: "0"
      # ECS/CodeBuild/Batch ExtraHosts (default off). Set to 1 to opt in.
      # NOCTAXRIS_INJECT_ECS_HOST_GATEWAY: "1"
    volumes:
      # API-only sealed state (master.key, state.db, s3/, …). Not mounted on DinD.
      - noctaxris-data:/var/lib/noctaxris
      # Lambda zip/code shared with nested engine (no master.key on privileged DinD).
      - noctaxris-compute:/var/lib/noctaxris/lambda
      - noctaxris-engine-certs:/certs:ro
    # DO NOT add docker.sock
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      noctaxris-compute-init:
        condition: service_completed_successfully
      noctaxris-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/noctaxris", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  noctaxris-engine:
    image: docker:27-dind
    # Privileged DinD required today for nested containers. Privilege reduction planned.
    privileged: true
    environment:
      # Include Compose DNS name so API TLS verify against noctaxris-engine succeeds.
      DOCKER_TLS_SAN: DNS:noctaxris-engine
    # DOCKER_TLS_CERTDIR defaults to /certs; engine listens on 2376 on the Compose network.
    volumes:
      - noctaxris-compute:/var/lib/noctaxris/lambda
      - noctaxris-engine-certs:/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Engine API stays on the Compose network only; do not add host mappings for 2375/2376.
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
volumes:
  noctaxris-data:
  noctaxris-compute:
  noctaxris-engine-certs:
