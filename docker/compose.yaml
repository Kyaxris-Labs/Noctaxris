services:
  noctaxris-compute-init:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    user: "0:0"
    volumes:
      - noctaxris-compute:/lambda
    # Named volumes are root-owned on first create; API runs as UID 65532 (distroless nonroot).
    command: ["sh", "-c", "chown -R 65532:65532 /lambda && chmod 775 /lambda"]
  noctaxris:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Default loopback publish. In-function SDK labs (fn-sidecar-secret) that need
      # DinD host-gateway reachability may set NOCTAXRIS_PUBLISH_ADDR=0.0.0.0 with
      # compose.lab-host-gateway.yaml (lab-only; prefer TLS if exposing beyond loopback).
      - "${NOCTAXRIS_PUBLISH_ADDR:-127.0.0.1}:4566:4566"
    environment:
      NOCTAXRIS_LISTEN: "0.0.0.0:4566"
      # Required for the container bind above. Default host publish is 127.0.0.1:4566.
      # Do not set NOCTAXRIS_PUBLISH_ADDR=0.0.0.0 without TLS except short lab sessions.
      NOCTAXRIS_ALLOW_NONLOOPBACK_LISTEN: "1"
      # Intentionally unset: Function URL / HTTP API AuthType NONE stay off on this
      # non-loopback bind. Opt in for CTF labs only:
      # NOCTAXRIS_ALLOW_OPEN_DATA_PLANE: "1"
      NOCTAXRIS_DATA_ROOT: "/var/lib/noctaxris"
      NOCTAXRIS_ROOT_ACCESS_KEY_ID: "${NOCTAXRIS_ROOT_ACCESS_KEY_ID}"
      NOCTAXRIS_ROOT_SECRET_ACCESS_KEY: "${NOCTAXRIS_ROOT_SECRET_ACCESS_KEY}"
      NOCTAXRIS_ACCOUNT_ID: "000000000001"
      # Nested DinD API on the Compose network only (TLS on 2376, never host docker.sock).
      NOCTAXRIS_DOCKER_HOST: "tcp://noctaxris-engine:2376"
      NOCTAXRIS_DOCKER_CERT_PATH: "/certs/client"
      # Function containers run inside DinD and reach the published API via
      # host.docker.internal (Docker Desktop). Override for Linux or custom wiring.
      NOCTAXRIS_LAMBDA_ENDPOINT_URL: "${NOCTAXRIS_LAMBDA_ENDPOINT_URL:-http://host.docker.internal:4566}"
      # Lambda ExtraHosts host.docker.internal. Code default is off; set 1 for
      # in-function SDK labs (fn-sidecar-secret). Docs previously said default on.
      NOCTAXRIS_INJECT_HOST_GATEWAY: "${NOCTAXRIS_INJECT_HOST_GATEWAY:-0}"
      # ECS/CodeBuild/Batch ExtraHosts (default off). Set to 1 to opt in.
      # NOCTAXRIS_INJECT_ECS_HOST_GATEWAY: "1"
    volumes:
      # API-only sealed state (master.key, state.db, s3/, …). Not mounted on DinD.
      - noctaxris-data:/var/lib/noctaxris
      # Lambda zip/code shared with nested engine (API RW for unpack; engine mounts :ro).
      - noctaxris-compute:/var/lib/noctaxris/lambda
      - noctaxris-engine-certs:/certs:ro
    # DO NOT add docker.sock
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      noctaxris-compute-init:
        condition: service_completed_successfully
      noctaxris-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/noctaxris", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
  noctaxris-engine:
    image: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
    # Default: restricted DinD (no privileged: true). Explicit caps/devices plus
    # host cgroup namespace so dockerd can write /sys/fs/cgroup (cgroup v2).
    # If docker info or Invoke fails on Desktop/WSL2, opt in:
    #   docker compose -f compose.yaml -f compose.engine-privileged.yaml up --build
    privileged: false
    cgroup: host
    cap_add:
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_ADMIN
      - NET_BIND_SERVICE
      - NET_RAW
      - SETFCAP
      - SETGID
      - SETPCAP
      - SETUID
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
      # Unmask /proc/sys so nested dockerd can toggle IPv6 on veth without privileged.
      - systempaths=unconfined
    devices:
      - /dev/fuse
    # Extra dockerd args (dind entrypoint forwards these). Avoid IPv6 sysctl writes on veth.
    command: ["--ipv6=false", "--ip6tables=false"]
    environment:
      # Include Compose DNS name so API TLS verify against noctaxris-engine succeeds.
      DOCKER_TLS_SAN: DNS:noctaxris-engine
    # DOCKER_TLS_CERTDIR defaults to /certs; engine listens on 2376 on the Compose network.
    volumes:
      # Read-only: DinD can still bind-mount code into tasks; cannot rewrite zip trees.
      - noctaxris-compute:/var/lib/noctaxris/lambda:ro
      - noctaxris-engine-certs:/certs
      # Writable cgroup fs for nested dockerd without privileged (paired with cgroup: host).
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      noctaxris-compute-init:
        condition: service_completed_successfully
    # Engine API stays on the Compose network only; do not add host mappings for 2375/2376.
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
volumes:
  noctaxris-data:
  noctaxris-compute:
  noctaxris-engine-certs:
