name: ci-required

# Required gates for release (and other callers). Failures must block Docker Hub publish.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to check out (tag, branch, or commit)
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1

  compose-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compose static checks
        run: go test ./docker/ -count=1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pin module version (not @latest) for supply-chain reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        # Native govulncheck has no per-ID exclude. scripts/govulncheck-ci still
        # fails on any non-allowlisted finding; allowlist is empty by default after
        # the moby client migration (see scripts/govulncheck-allowlist.txt and
        # docs/security-defaults.md).
        run: go run ./scripts/govulncheck-ci

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scoped race tests (kernel + store)
        run: go test ./internal/kernel/... ./internal/store/... -race -count=1 -timeout 30m

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build API image
        run: docker build -f docker/Dockerfile .

  smoke-core:
    runs-on: ubuntu-latest
    needs: [unit, compose-static, image]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install AWS CLI v2
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
      - name: Prepare Compose env
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          ROOT_AKID="AKIANOCTAXRISCI$(openssl rand -hex 6 | tr '[:lower:]' '[:upper:]')"
          ROOT_SECRET="$(openssl rand -hex 32)"
          awk -v akid="$ROOT_AKID" -v secret="$ROOT_SECRET" '
            /^NOCTAXRIS_ROOT_ACCESS_KEY_ID=/ { print "NOCTAXRIS_ROOT_ACCESS_KEY_ID=" akid; next }
            /^NOCTAXRIS_ROOT_SECRET_ACCESS_KEY=/ { print "NOCTAXRIS_ROOT_SECRET_ACCESS_KEY=" secret; next }
            { print }
          ' docker/.env > docker/.env.tmp
          mv docker/.env.tmp docker/.env
          {
            echo "AWS_ACCESS_KEY_ID=${ROOT_AKID}"
            echo "AWS_SECRET_ACCESS_KEY=${ROOT_SECRET}"
          } >> "$GITHUB_ENV"
      - name: Compose up
        run: docker compose -f docker/compose.yaml --env-file docker/.env up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4566/_noctaxris/ready | grep -q ready; then
              echo "ready"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color || true
          exit 1
      - name: Core CLI smoke (STS/S3/KMS/DynamoDB)
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          EP: http://127.0.0.1:4566
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          aws sts get-caller-identity --endpoint-url "$EP"
          BUCKET="noctaxris-ci-$(date +%s)"
          aws s3 mb "s3://${BUCKET}" --endpoint-url "$EP"
          echo smoke-core > /tmp/smoke-core.txt
          aws s3 cp /tmp/smoke-core.txt "s3://${BUCKET}/smoke.txt" --endpoint-url "$EP"
          KEY_ID=$(aws kms create-key --endpoint-url "$EP" --query KeyMetadata.KeyId --output text)
          aws kms encrypt --key-id "$KEY_ID" --plaintext "$(echo -n hello | base64)" --endpoint-url "$EP" >/dev/null
          TABLE="noctaxris-ci-ddb-$(date +%s)"
          aws dynamodb create-table \
            --table-name "$TABLE" \
            --attribute-definitions AttributeName=pk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url "$EP"
          aws dynamodb put-item \
            --table-name "$TABLE" \
            --item '{"pk":{"S":"1"},"data":{"S":"smoke"}}' \
            --endpoint-url "$EP"
          aws dynamodb get-item \
            --table-name "$TABLE" \
            --key '{"pk":{"S":"1"}}' \
            --endpoint-url "$EP" \
            --query 'Item.data.S' \
            --output text | grep -qx smoke
      - name: Audit hygiene (root secret absent)
        env:
          ROOT_SECRET: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          CID=$(docker compose -f docker/compose.yaml --env-file docker/.env ps -q noctaxris)
          docker run --rm --volumes-from "$CID" -e ROOT_SECRET busybox \
            sh -c 'test -f /var/lib/noctaxris/cloudtrail/events.jsonl && ! grep -Fq "$ROOT_SECRET" /var/lib/noctaxris/cloudtrail/events.jsonl'
      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.yaml --env-file docker/.env down -v
