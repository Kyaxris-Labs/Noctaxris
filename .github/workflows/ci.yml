name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nested DinD is not on every PR; weekly main smoke keeps the contract honest.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      nested_smoke:
        description: Run nested DinD smoke (engine healthy, RDS describe, Data API nested-psql, Lambda zip/Image Invoke, ECS RunTask)
        type: boolean
        default: false
      integration_suites:
        description: Run SDK / Terraform / CloudFormation integration suites against Compose
        type: boolean
        default: false
      advanced_suites:
        description: Also run NOCTAXRIS_ADVANCED=1 (SDK fullstack + Terraform lab-fullstack)
        type: boolean
        default: false
      nested_sdk:
        description: Also run NOCTAXRIS_NESTED=1 (SDK Lambda Invoke) when integration suites run
        type: boolean
        default: false
      tf_fullstack:
        description: Also run TF_FULLSTACK=1 (Terraform lab-fullstack after lab-core)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./... -count=1

  compose-static:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compose static checks
        run: go test ./docker/ -count=1

  govulncheck:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        # Pin module version (not @latest) for supply-chain reproducibility.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        # Native govulncheck has no per-ID exclude. scripts/govulncheck-ci still
        # fails on any non-allowlisted finding; allowlist is only daemon-side Docker
        # Engine CVEs with Fixed in: N/A on github.com/docker/docker (see
        # scripts/govulncheck-allowlist.txt and docs/security-defaults.md).
        run: go run ./scripts/govulncheck-ci

  sbom:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [image]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image for SBOM
        run: docker build -t noctaxris:ci-sbom -f docker/Dockerfile .
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: noctaxris:ci-sbom
          format: spdx-json
          output-file: noctaxris-sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctaxris-sbom
          path: noctaxris-sbom.spdx.json

  race:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scoped race tests (kernel + store)
        run: go test ./internal/kernel/... ./internal/store/... -race -count=1 -timeout 30m

  image:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f docker/Dockerfile .

  smoke-core:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs: [unit, compose-static, image]
    steps:
      - uses: actions/checkout@v7
      - name: Install AWS CLI v2
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version
      - name: Prepare Compose env
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          # Compose binds 0.0.0.0; shipped example roots are refused. Inject unique CI roots.
          ROOT_AKID="AKIANOCTAXRISCI$(openssl rand -hex 6 | tr '[:lower:]' '[:upper:]')"
          ROOT_SECRET="$(openssl rand -hex 32)"
          awk -v akid="$ROOT_AKID" -v secret="$ROOT_SECRET" '
            /^NOCTAXRIS_ROOT_ACCESS_KEY_ID=/ { print "NOCTAXRIS_ROOT_ACCESS_KEY_ID=" akid; next }
            /^NOCTAXRIS_ROOT_SECRET_ACCESS_KEY=/ { print "NOCTAXRIS_ROOT_SECRET_ACCESS_KEY=" secret; next }
            { print }
          ' docker/.env > docker/.env.tmp
          mv docker/.env.tmp docker/.env
          {
            echo "AWS_ACCESS_KEY_ID=${ROOT_AKID}"
            echo "AWS_SECRET_ACCESS_KEY=${ROOT_SECRET}"
          } >> "$GITHUB_ENV"
      - name: Compose up
        run: docker compose -f docker/compose.yaml --env-file docker/.env up --build -d
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4566/_noctaxris/ready | grep -q ready; then
              echo "ready"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color || true
          exit 1
      - name: Core CLI smoke (STS/S3/KMS/DynamoDB)
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          EP: http://127.0.0.1:4566
        run: |
          set -euo pipefail
          aws configure set default.s3.addressing_style path
          aws sts get-caller-identity --endpoint-url "$EP"
          BUCKET="noctaxris-ci-$(date +%s)"
          aws s3 mb "s3://${BUCKET}" --endpoint-url "$EP"
          echo smoke-core > /tmp/smoke-core.txt
          aws s3 cp /tmp/smoke-core.txt "s3://${BUCKET}/smoke.txt" --endpoint-url "$EP"
          KEY_ID=$(aws kms create-key --endpoint-url "$EP" --query KeyMetadata.KeyId --output text)
          aws kms encrypt --key-id "$KEY_ID" --plaintext "$(echo -n hello | base64)" --endpoint-url "$EP" >/dev/null
          TABLE="noctaxris-ci-ddb-$(date +%s)"
          aws dynamodb create-table \
            --table-name "$TABLE" \
            --attribute-definitions AttributeName=pk,AttributeType=S \
            --key-schema AttributeName=pk,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --endpoint-url "$EP"
          aws dynamodb put-item \
            --table-name "$TABLE" \
            --item '{"pk":{"S":"1"},"data":{"S":"smoke"}}' \
            --endpoint-url "$EP"
          aws dynamodb get-item \
            --table-name "$TABLE" \
            --key '{"pk":{"S":"1"}}' \
            --endpoint-url "$EP" \
            --query 'Item.data.S' \
            --output text | grep -qx smoke
      - name: Audit hygiene (root secret absent)
        env:
          ROOT_SECRET: ${{ env.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          CID=$(docker compose -f docker/compose.yaml --env-file docker/.env ps -q noctaxris)
          docker run --rm --volumes-from "$CID" -e ROOT_SECRET busybox \
            sh -c 'test -f /var/lib/noctaxris/cloudtrail/events.jsonl && ! grep -Fq "$ROOT_SECRET" /var/lib/noctaxris/cloudtrail/events.jsonl'
      - name: Compose down
        if: always()
        run: docker compose -f docker/compose.yaml --env-file docker/.env down -v

  smoke-nested:
    runs-on: ubuntu-latest
    # Manual workflow_dispatch, or weekly schedule on default branch. Not on push/PR.
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.nested_smoke)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Require Docker
        id: docker
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "Docker unavailable; skipping nested smoke"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Install AWS CLI v2 and zip
        if: steps.docker.outputs.skip != 'true'
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          aws --version
      - name: Nested DinD smoke
        if: steps.docker.outputs.skip != 'true'
        env:
          READY_TIMEOUT_SEC: "240"
        run: bash docker/smoke-nested.sh

  integration-suites:
    runs-on: ubuntu-latest
    # Optional: workflow_dispatch with integration_suites=true, or PRs that touch tests/**.
    # Not a required status check; smoke-core remains the PR Compose gate.
    # Default path stays fast (no ADVANCED/NESTED). Opt in via workflow_dispatch inputs.
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.integration_suites) ||
      github.event_name == 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            tests:
              - 'tests/**'
              - '.github/workflows/ci.yml'
      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.filter.outputs.tests }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.decide.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/sdk/nodejs/package-lock.json
      - uses: actions/setup-python@v7
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install Terraform
        if: steps.decide.outputs.run == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Install AWS CLI v2
        if: steps.decide.outputs.run == 'true'
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
      - name: Prepare Compose env
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp docker/.env.example docker/.env
          # Compose binds 0.0.0.0; shipped example roots are refused. Inject unique CI roots.
          ROOT_AKID="AKIANOCTAXRISCI$(openssl rand -hex 6 | tr '[:lower:]' '[:upper:]')"
          ROOT_SECRET="$(openssl rand -hex 32)"
          awk -v akid="$ROOT_AKID" -v secret="$ROOT_SECRET" '
            /^NOCTAXRIS_ROOT_ACCESS_KEY_ID=/ { print "NOCTAXRIS_ROOT_ACCESS_KEY_ID=" akid; next }
            /^NOCTAXRIS_ROOT_SECRET_ACCESS_KEY=/ { print "NOCTAXRIS_ROOT_SECRET_ACCESS_KEY=" secret; next }
            { print }
          ' docker/.env > docker/.env.tmp
          mv docker/.env.tmp docker/.env
          {
            echo "AWS_ACCESS_KEY_ID=${ROOT_AKID}"
            echo "AWS_SECRET_ACCESS_KEY=${ROOT_SECRET}"
          } >> "$GITHUB_ENV"
      - name: Compose up
        if: steps.decide.outputs.run == 'true'
        run: docker compose -f docker/compose.yaml --env-file docker/.env up --build -d
      - name: Wait for readiness
        if: steps.decide.outputs.run == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4566/_noctaxris/ready | grep -q ready; then
              echo "ready"
              exit 0
            fi
            sleep 5
          done
          echo "API never became ready" >&2
          docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color || true
          exit 1
      - name: Optional advanced / nested flags
        if: steps.decide.outputs.run == 'true'
        id: flags
        run: |
          ADVANCED=""
          NESTED=""
          TF_FULLSTACK=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.advanced_suites }}" = "true" ]; then
              ADVANCED=1
            fi
            if [ "${{ inputs.nested_sdk }}" = "true" ]; then
              NESTED=1
            fi
            if [ "${{ inputs.tf_fullstack }}" = "true" ]; then
              TF_FULLSTACK=1
            fi
          fi
          echo "advanced=$ADVANCED" >> "$GITHUB_OUTPUT"
          echo "nested=$NESTED" >> "$GITHUB_OUTPUT"
          echo "tf_fullstack=$TF_FULLSTACK" >> "$GITHUB_OUTPUT"
      - name: Integration suites
        if: steps.decide.outputs.run == 'true'
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
          NOCTAXRIS_ENDPOINT: http://127.0.0.1:4566
          NOCTAXRIS_ADVANCED: ${{ steps.flags.outputs.advanced }}
          NOCTAXRIS_NESTED: ${{ steps.flags.outputs.nested }}
          TF_FULLSTACK: ${{ steps.flags.outputs.tf_fullstack }}
        run: bash tests/run-all.sh
      - name: Compose down
        if: always() && steps.decide.outputs.run == 'true'
        run: docker compose -f docker/compose.yaml --env-file docker/.env down -v
